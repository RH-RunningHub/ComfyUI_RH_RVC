#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["av", "faiss-cpu", "fairseq>=0.12.0", "ffmpeg-python", "librosa", "praat-parselmouth", "pyworld", "scipy", "scikit-learn", "soundfile", "tensorboard", "torchcrepe", "tqdm"]

[project.urls]
Repository = "https://github.com/RH-RunningHub/ComfyUI_RH_RVC"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/RH-RunningHub/ComfyUI_RH_RVC/wiki"
"Bug Tracker" = "https://github.com/RH-RunningHub/ComfyUI_RH_RVC/issues"

[tool.comfy]
PublisherId = "gluttony10"
DisplayName = "ComfyUI_RH_RVC"
Icon = ""
includes = [] 
